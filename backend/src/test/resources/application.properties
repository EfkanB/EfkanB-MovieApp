# Testler bellek içi H2 veritabanında çalışır (MySQL gerekmez)
spring.datasource.url=jdbc:h2:mem:movieapp-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.cors.allowed-origins=http://localhost:5173
jwt.secret=test-secret-test-secret-test-secret-1234
jwt.expiration-ms=3600000

spring.mail.host=localhost
app.mail.from=test@example.com
app.frontend.reset-password-url=http://localhost:5173/reset-password
