# --- MySQL (production) ---
# Yerelde SSL kapalı; yayında DB ayrı sunucudaysa DB_URL içinde sslMode=REQUIRED kullan
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movieapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:movieapp_user}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Nginx gibi bir reverse proxy arkasında gerçek istemci IP'sini al (rate limit için).
# Sadece iç ağdaki proxy'lerden gelen X-Forwarded-For başlığına güvenilir.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Hata cevaplarında iç detay gösterme
server.error.include-message=never
server.error.include-stacktrace=never

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# CORS: API'yi tarayıcıdan çağırabilecek siteler (virgülle ayrılmış). "*" kabul edilmez.
# Örnek: CORS_ALLOWED_ORIGINS=https://movieapp.example.com,https://www.movieapp.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT Configuration
# En az 32 karakter. Tanımlanmazsa her açılışta rastgele geçici anahtar üretilir.
# Üretmek için: openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Mail (Gmail SMTP) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:YOUR_GMAIL_USERNAME@gmail.com}
spring.mail.password=${MAIL_PASSWORD:YOUR_GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:YOUR_GMAIL_USERNAME@gmail.com}

# Frontend reset-password sayfası
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
