# MovieApp için örnek Nginx ayarı
#
# - Frontend: `cd frontend && npm run build` çıktısı (frontend/dist) /var/www/movieapp altına kopyalanır
# - Backend:  Spring Boot 127.0.0.1:8080'de çalışır (dışarıya açılmaz)
# - HTTPS için: sudo certbot --nginx -d senin-alan-adin.com

server {
    listen 80;
    server_name senin-alan-adin.com;

    root /var/www/movieapp;
    index index.html;

    # Güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # İstek gövdesi sınırı
    client_max_body_size 1m;

    # API isteklerini backend'e ilet
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React tek sayfa uygulaması: /reset-password gibi adresler index.html'e düşsün
    location / {
        try_files $uri $uri/ /index.html;
    }
}
